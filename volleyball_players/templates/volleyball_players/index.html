{% extends 'base.html' %}

{% block content %}
<h1>{{ title }}</h1>


<ul>
    {% for post in posts %}
    {% if post.is_published %}
    <li>
        <h2>{{ post.title }}</h2>
        <p>{{ post.content|linebreaks|truncatewords:40 }}</p>
        <p><a href="{% url 'post' post.id %}">Читать пост</a></p>
    </li>
    {% endif %}
    {% endfor %}
</ul>


{% endblock content %}
